name: Deploy DLT Pipeline with DABs

on:
  push:
    branches: [ '*' ]  # Trigger on push to any branch for validation, deployment on specific branches
  pull_request:
    branches: [ '*' ]
    types: [opened, synchronize, reopened]

jobs:
  validate:
    name: Run Bundle Validations in Development
    runs-on: ubuntu-latest
    permissions:
      # Required for GitHub OIDC token authentication
      id-token: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch full history for accurate bundle comparison

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Databricks CLI and Dependencies
        uses: databricks/setup-cli@main

      - name: Get OIDC ID Token
        id: get_id_token
        run: |
          # Use the built-in ACTIONS_ID_TOKEN_REQUEST_URL and ACTIONS_ID_TOKEN_REQUEST_TOKEN
          IDTOKEN=$(curl -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://github.com/RookieDataEngineer" | jq -r '.value')
          echo "Token obtained: ${#IDTOKEN} characters long"
          echo "::add-mask::$IDTOKEN"
          echo "idtoken=$IDTOKEN" >> $GITHUB_OUTPUT
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ secrets.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ secrets.ACTIONS_ID_TOKEN_REQUEST_URL }}

      - name: Exchange GitHub JWT for Databricks Token
        id: get_databricks_token
        run: |
          DATABRICKS_TOKEN=$(curl --request POST "${{ secrets.DATABRICKS_WORKSPACE_HOST }}/oidc/v1/token" \
            --data "client_id=${{ secrets.SERVICE_PRINCIPAL_ID }}" \
            --data "subject_token=${{ steps.get_id_token.outputs.idtoken }}" \
            --data 'subject_token_type=urn:ietf:params:oauth:token-type:jwt' \
            --data 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
            --data 'scope=all-apis' | jq -r '.access_token')

          echo "Using token of length: ${#DATABRICKS_TOKEN}"
          echo "::add-mask::$DATABRICKS_TOKEN"
          echo "DATABRICKS_TOKEN=$DATABRICKS_TOKEN" >> $GITHUB_ENV # Store token in job environment
          
          if [ -n "$DATABRICKS_TOKEN" ]; then
            echo "token_obtained=true" >> $GITHUB_OUTPUT
          else
            echo "token_obtained=false" >> $GITHUB_OUTPUT
          fi

      - name: Update Databricks Host in Config (if necessary)
        if: steps.get_databricks_token.outputs.token_obtained == 'true'
        run: |
          # Ensure script exists and is executable
          if [ -f ./update_bundle_host.sh ]; then
             chmod +x ./update_bundle_host.sh
             ./update_bundle_host.sh "${{ secrets.DATABRICKS_WORKSPACE_HOST }}"
          else
             echo "update_bundle_host.sh not found, skipping."
          fi

      - name: Run Bundle Validation
        if: steps.get_databricks_token.outputs.token_obtained == 'true'
        run: databricks bundle validate
        working-directory: .
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_WORKSPACE_HOST }}
          DATABRICKS_TOKEN: ${{ env.DATABRICKS_TOKEN }}
          DATABRICKS_BUNDLE_ENV: development # Always validate in development environment
          
      # Deploy to development for validation regardless of target branch
      - name: Deploy to Development for Validation
        id: deploy_dev
        if: steps.get_databricks_token.outputs.token_obtained == 'true'
        run: |
          echo "Deploying to development environment for validation..."
          databricks bundle deploy
          echo "deployment_status=success" >> $GITHUB_OUTPUT
        working-directory: .
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_WORKSPACE_HOST }}
          DATABRICKS_TOKEN: ${{ env.DATABRICKS_TOKEN }}
          DATABRICKS_BUNDLE_ENV: development  # Always deploy to development for validation
          
      - name: Get Development DLT Pipeline IDs
        id: get_pipeline_ids
        if: steps.deploy_dev.outputs.deployment_status == 'success' && steps.get_databricks_token.outputs.token_obtained == 'true'
        run: |
          # Ensure the script is executable
          chmod +x ./get_pipeline_ids.sh
          
          # Execute the script, always passing 'development' as the target environment
          SCRIPT_OUTPUT=$(./get_pipeline_ids.sh "development")
          
          if [ -z "$SCRIPT_OUTPUT" ]; then
            echo "Script returned no pipeline IDs. This might be expected or indicate an issue (check logs above)."
            echo "pipeline_ids=''" >> $GITHUB_OUTPUT
          else
            echo "Script successfully returned pipeline IDs: $SCRIPT_OUTPUT"
            echo "pipeline_ids=$SCRIPT_OUTPUT" >> $GITHUB_OUTPUT
          fi
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_WORKSPACE_HOST }}
          DATABRICKS_TOKEN: ${{ env.DATABRICKS_TOKEN }}

      - name: Validate Deployed Pipelines
        id: validate_pipelines
        if: steps.get_pipeline_ids.outputs.pipeline_ids != '' && steps.get_databricks_token.outputs.token_obtained == 'true'
        run: |
          # Ensure the script is executable
          chmod +x ./validate_pipelines.sh
          
          # Execute the script, passing the pipeline IDs and 'development' as target
          VALIDATION_RESULT=$(./validate_pipelines.sh "${{ steps.get_pipeline_ids.outputs.pipeline_ids }}" "development")
          
          if [ "$VALIDATION_RESULT" = "success" ]; then
            echo "validation_status=success" >> $GITHUB_OUTPUT
            echo "All pipeline validations passed."
          else
            echo "validation_status=failure" >> $GITHUB_OUTPUT
            echo "::error::One or more pipeline validations failed."
          fi
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_WORKSPACE_HOST }}
          DATABRICKS_TOKEN: ${{ env.DATABRICKS_TOKEN }}

  # Only run deploy job if validation was successful and we're on a deployment branch
  deploy:
    name: Deploy to Target Environment
    runs-on: ubuntu-latest
    needs: [validate]
    if: |
      needs.validate.outputs.validation_status == 'success' && 
      github.event_name == 'push' && 
      (github.ref == 'refs/heads/development' || github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/production')
    permissions:
      id-token: write
      contents: write
      pull-requests: write  # Needed for creating PRs during rollback

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch full history

      - name: Determine Target Environment
        id: determine_env
        run: |
          BRANCH_NAME=$(echo "${{ github.ref }}" | sed 's#refs/heads/##')
          echo "Branch name: $BRANCH_NAME"
          # Simple mapping, adjust as needed
          if [[ "$BRANCH_NAME" == "production" ]]; then
            echo "bundle_env=production" >> $GITHUB_OUTPUT
          elif [[ "$BRANCH_NAME" == "staging" ]]; then
            echo "bundle_env=staging" >> $GITHUB_OUTPUT
          else
            # Default to development for 'development' branch 
            echo "bundle_env=development" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Databricks CLI and Dependencies
        uses: databricks/setup-cli@main

      # --- Authentication Steps ---
      - name: Get OIDC ID Token
        id: get_id_token
        run: |
          IDTOKEN=$(curl -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://github.com/RookieDataEngineer" | jq -r '.value')
          echo "Token obtained: ${#IDTOKEN} characters long"
          echo "::add-mask::$IDTOKEN"
          echo "idtoken=$IDTOKEN" >> $GITHUB_OUTPUT
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ secrets.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ secrets.ACTIONS_ID_TOKEN_REQUEST_URL }}

      - name: Exchange GitHub JWT for Databricks Token
        id: get_databricks_token
        run: |
          DATABRICKS_TOKEN=$(curl --request POST "${{ secrets.DATABRICKS_WORKSPACE_HOST }}/oidc/v1/token" \
            --data "client_id=${{ secrets.SERVICE_PRINCIPAL_ID }}" \
            --data "subject_token=${{ steps.get_id_token.outputs.idtoken }}" \
            --data 'subject_token_type=urn:ietf:params:oauth:token-type:jwt' \
            --data 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
            --data 'scope=all-apis' | jq -r '.access_token')

          echo "Using token of length: ${#DATABRICKS_TOKEN}"
          echo "::add-mask::$DATABRICKS_TOKEN"
          echo "DATABRICKS_TOKEN=$DATABRICKS_TOKEN" >> $GITHUB_ENV # Store token in job environment
          
          if [ -n "$DATABRICKS_TOKEN" ]; then
            echo "token_obtained=true" >> $GITHUB_OUTPUT
          else
            echo "token_obtained=false" >> $GITHUB_OUTPUT
          fi

      - name: Update Databricks Host in Config
        if: steps.get_databricks_token.outputs.token_obtained == 'true'
        run: |
          if [ -f ./update_bundle_host.sh ]; then
             chmod +x ./update_bundle_host.sh
             ./update_bundle_host.sh "${{ secrets.DATABRICKS_WORKSPACE_HOST }}"
          else
             echo "update_bundle_host.sh not found, skipping."
          fi
      # --- End Authentication Steps ---

      - name: Deploy Bundle to Target Environment
        id: deploy_target
        if: steps.get_databricks_token.outputs.token_obtained == 'true'
        run: |
          echo "Deploying to ${{ steps.determine_env.outputs.bundle_env }} environment..."
          
          # Try to deploy to the target environment
          if databricks bundle deploy; then
            echo "deployment_status=success" >> $GITHUB_OUTPUT
            echo "Successfully deployed to ${{ steps.determine_env.outputs.bundle_env }} environment."
          else
            echo "deployment_status=failure" >> $GITHUB_OUTPUT
            echo "::error::Failed to deploy to ${{ steps.determine_env.outputs.bundle_env }} environment."
          fi
        working-directory: .
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_WORKSPACE_HOST }}
          DATABRICKS_TOKEN: ${{ env.DATABRICKS_TOKEN }}
          DATABRICKS_BUNDLE_ENV: ${{ steps.determine_env.outputs.bundle_env }}

      - name: Get Target DLT Pipeline IDs
        id: get_target_pipeline_ids
        if: steps.deploy_target.outputs.deployment_status == 'success' && steps.get_databricks_token.outputs.token_obtained == 'true'
        run: |
          chmod +x ./get_pipeline_ids.sh
          SCRIPT_OUTPUT=$(./get_pipeline_ids.sh "${{ steps.determine_env.outputs.bundle_env }}")
          
          if [ -z "$SCRIPT_OUTPUT" ]; then
            echo "No pipeline IDs found in target environment."
            echo "pipeline_ids=''" >> $GITHUB_OUTPUT
          else
            echo "Successfully retrieved pipeline IDs: $SCRIPT_OUTPUT"
            echo "pipeline_ids=$SCRIPT_OUTPUT" >> $GITHUB_OUTPUT
          fi
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_WORKSPACE_HOST }}
          DATABRICKS_TOKEN: ${{ env.DATABRICKS_TOKEN }}

      - name: Validate Target Pipelines
        id: validate_target_pipelines
        if: steps.get_target_pipeline_ids.outputs.pipeline_ids != '' && steps.get_databricks_token.outputs.token_obtained == 'true'
        run: |
          chmod +x ./validate_pipelines.sh
          VALIDATION_RESULT=$(./validate_pipelines.sh "${{ steps.get_target_pipeline_ids.outputs.pipeline_ids }}" "${{ steps.determine_env.outputs.bundle_env }}")
          
          if [ "$VALIDATION_RESULT" = "success" ]; then
            echo "validation_status=success" >> $GITHUB_OUTPUT
            echo "All pipeline validations in target environment passed."
          else
            echo "validation_status=failure" >> $GITHUB_OUTPUT
            echo "::error::One or more pipeline validations in target environment failed."
          fi
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_WORKSPACE_HOST }}
          DATABRICKS_TOKEN: ${{ env.DATABRICKS_TOKEN }}
          
      - name: Rollback on Target Validation Failure
        if: steps.validate_target_pipelines.outputs.validation_status == 'failure' && steps.get_databricks_token.outputs.token_obtained == 'true'
        run: |
          # Get current branch and setup variables
          CURRENT_BRANCH=$(echo "${{ github.ref }}" | sed 's#refs/heads/##')
          ROLLBACK_BRANCH="rollback/${CURRENT_BRANCH}_$(date +%Y%m%d_%H%M%S)"
          PREVIOUS_COMMIT="${{ github.event.before }}"
          
          echo "::warning::Pipeline validation failed in ${{ steps.determine_env.outputs.bundle_env }}. Initiating rollback."
          
          # 1. Create rollback branch with previous commit state
          echo "Creating rollback branch: $ROLLBACK_BRANCH"
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git checkout -b "$ROLLBACK_BRANCH" "$PREVIOUS_COMMIT"
          
          # 2. Deploy previous state to target environment
          echo "Deploying previous version to ${{ steps.determine_env.outputs.bundle_env }}..."
          databricks bundle deploy
          
          # 3. Push rollback branch and create PR
          git push origin "$ROLLBACK_BRANCH"
          
          # 4. Create PR using GitHub CLI
          gh pr create \
            --base "$CURRENT_BRANCH" \
            --head "$ROLLBACK_BRANCH" \
            --title "ROLLBACK: Revert $CURRENT_BRANCH to previous state" \
            --body "Automated rollback due to failed pipeline validation in ${{ steps.determine_env.outputs.bundle_env }} environment. This PR reverts $CURRENT_BRANCH to commit $PREVIOUS_COMMIT."
            
          echo "::error::Rollback completed. A PR has been created to revert $CURRENT_BRANCH to the previous state."
          exit 1  # Indicate the workflow failed
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_WORKSPACE_HOST }}
          DATABRICKS_TOKEN: ${{ env.DATABRICKS_TOKEN }}
          DATABRICKS_BUNDLE_ENV: ${{ steps.determine_env.outputs.bundle_env }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed for gh CLI